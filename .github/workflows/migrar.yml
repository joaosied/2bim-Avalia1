name: migrar

on:
  push:
    branches: [main]
    paths:
      - migrations/**
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Aplica as migrações D1 remotamente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply oauth-sessions-joao --remote

      - name: Confirma a estrutura da tabela
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute oauth-sessions-joao --remote --command "PRAGMA table_info(sessions);" | tee pragma.txt

      - name: Prepara o resumo da migração
        run: |
          {
            echo "Resuma em português a migração D1 aplicada remotamente."
            echo "Migrações versionadas:"
            ls migrations/*.sql
            echo "Saída real do PRAGMA table_info(sessions):"
            cat pragma.txt
          } > migration-summary.txt

      - id: resumo
        name: Resume a migração com IA
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        with:
          provider: copilot
          model: ""
          prompt-file: migration-summary.txt
          system-prompt: Você é um assistente que resume evidências de migrações de banco.

      - name: Publica o resumo no job
        env:
          RESPONSE_FILE: ${{ steps.resumo.outputs.response-file }}
        run: |
          {
            echo "## Resumo automático da migração"
            cat "$RESPONSE_FILE"
            echo
            echo "## PRAGMA table_info(sessions)"
            echo '```text'
            cat pragma.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
